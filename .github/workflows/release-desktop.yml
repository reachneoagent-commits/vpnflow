name: Desktop preview release (macOS + Windows)

# Publishes a GitHub pre-release the FlowApps launcher can install from.
# File names follow Tauri's `<Name>_<version>_<arch>` pattern, which the
# launcher reads. Builds are PREVIEWS: unsigned, and the Windows service has
# no tunnel support yet (see docs/releases/RELEASE_CHECKLIST.md).

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to publish, must equal Cargo.toml (for example 0.1.1)"
        required: true

permissions:
  contents: write

env:
  TAG: v${{ inputs.confirm_version }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version matches the source
        run: |
          set -euo pipefail
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          pkg_v=$(grep -m1 '"version"' apps/desktop/package.json | cut -d'"' -f4)
          tauri_v=$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Cargo $cargo_v, package.json $pkg_v, tauri.conf.json $tauri_v"
          for v in "$cargo_v" "$pkg_v" "$tauri_v"; do
            test "$v" = "${{ inputs.confirm_version }}"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a failed build keeps the existing release.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "VPNFlow ${{ inputs.confirm_version }}" \
            --notes "Preview build. Unsigned. macOS: the first launch asks for your Mac password once to set up the background helper. Windows: the tunnel service is not implemented yet, so Windows cannot connect. See docs/releases/RELEASE_CHECKLIST.md."

  macos:
    needs: create-release
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build and stage the background helper
        # The app installs these itself on first run (one admin prompt).
        # Go is preinstalled on GitHub's macOS runners.
        run: |
          set -euo pipefail
          go version
          git clone --quiet --depth 1 --branch 0.0.20250522 https://git.zx2c4.com/wireguard-go "$RUNNER_TEMP/wg-src"
          (cd "$RUNNER_TEMP/wg-src" && CGO_ENABLED=0 GOOS=darwin GOARCH="$(go env GOARCH)" \
            go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/wireguard-go" .)
          cargo build --release --locked -p vpnflow-daemon --target ${{ matrix.target }}
          scripts/macos/stage-helper.sh "target/${{ matrix.target }}/release/vpnflow-daemon" "$RUNNER_TEMP/wireguard-go"
      - name: Build the disk image and the signed update file
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --ci --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      - name: Upload with checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release/bundle/dmg
          test "$(ls *.dmg | wc -l)" -eq 1
          shasum -a 256 *.dmg > "SHA256SUMS-${{ matrix.target }}.txt"
          gh release upload "$TAG" --repo "${{ github.repository }}" *.dmg "SHA256SUMS-${{ matrix.target }}.txt"
          # The in-app updater installs this file after checking its signature.
          cd ../macos
          test -s VPNFlow.app.tar.gz && test -s VPNFlow.app.tar.gz.sig
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          cp VPNFlow.app.tar.gz "update-darwin-$arch.app.tar.gz"
          cp VPNFlow.app.tar.gz.sig "update-darwin-$arch.app.tar.gz.sig"
          gh release upload "$TAG" --repo "${{ github.repository }}" "update-darwin-$arch.app.tar.gz" "update-darwin-$arch.app.tar.gz.sig"

  windows:
    needs: create-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the installer and the signed update file
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --ci --bundles msi --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      - name: Upload with checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd target/release/bundle/msi
          test "$(ls *.msi | wc -l)" -eq 1
          sha256sum *.msi > SHA256SUMS-windows.txt
          test -s *.msi.sig
          gh release upload "$TAG" --repo "${{ github.repository }}" *.msi *.msi.sig SHA256SUMS-windows.txt

  update-manifest:
    # Publishes latest.json, the file the app's updater reads. It lists each
    # signed update file and its signature. Windows cannot connect yet, but its
    # entry is kept so the app can still update itself there.
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig'
          ls
          python3 - <<'EOF'
          import glob, json, os, datetime
          repo, tag, ver = os.environ["REPO"], os.environ["TAG"], os.environ["VERSION"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          def sig(name): return open(name).read().strip()
          platforms = {}
          for arch in ("aarch64", "x86_64"):
              f = f"update-darwin-{arch}.app.tar.gz"
              platforms[f"darwin-{arch}"] = {"signature": sig(f + ".sig"), "url": base + f}
          msi = glob.glob("*.msi.sig")
          assert len(msi) == 1, msi
          platforms["windows-x86_64"] = {"signature": sig(msi[0]), "url": base + msi[0][:-4]}
          doc = {
              "version": ver,
              "notes": f"VPNFlow {ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(doc, open("../latest.json", "w"), indent=2)
          EOF
          cd ..
          cat latest.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["version"], list(d["platforms"]))'
          gh release upload "$TAG" --repo "$REPO" latest.json
