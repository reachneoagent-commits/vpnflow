name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt, clippy, tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev shellcheck shfmt
      - name: Frontend placeholder for tauri::generate_context
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test -p aegis-desktop --test glib_security --release --locked
      - run: shellcheck scripts/test-netns-peer.sh scripts/test-netns-peer.test.sh scripts/vm/run-vm-tests.sh scripts/install-helper.sh scripts/install-helper.test.sh
      - run: shfmt -d scripts/test-netns-peer.sh scripts/test-netns-peer.test.sh scripts/vm/run-vm-tests.sh scripts/install-helper.sh scripts/install-helper.test.sh
      - run: bash scripts/test-netns-peer.test.sh
      - run: bash scripts/install-helper.test.sh
      - run: shellcheck scripts/build-linux-helper.sh apps/desktop/src-tauri/packaging/deb-prerm.sh apps/desktop/src-tauri/packaging/rpm-preun.sh scripts/package-hooks.test.sh
      - run: shfmt -d scripts/build-linux-helper.sh apps/desktop/src-tauri/packaging/deb-prerm.sh apps/desktop/src-tauri/packaging/rpm-preun.sh scripts/package-hooks.test.sh
      - run: bash scripts/package-hooks.test.sh

  frontend:
    name: Frontend lint, typecheck, tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  supply-chain:
    name: Advisories and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
      - name: npm audit (production deps)
        working-directory: apps/desktop
        run: npx --yes pnpm@12 audit --prod

  windows:
    name: Windows build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Frontend placeholder for tauri::generate_context
        shell: bash
        run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
