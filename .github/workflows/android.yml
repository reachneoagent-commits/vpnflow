name: Android preview build

# Builds an installable APK on GitHub's machines (Java, Android SDK and NDK are
# preinstalled there), so nothing has to be installed on a developer's Mac.
# The APK is a PREVIEW for sideloading. It is signed with the key in the
# ANDROID_KEYSTORE_B64 secret when that exists (so updates install over the old
# app). Without the secret it is signed with a throwaway key: install works, but
# the next build must be installed after uninstalling the old app.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "CPU type: aarch64 (real phones, Fire TV) or x86_64 (emulators)"
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - x86_64

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ABI: ${{ inputs.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Point the build at the preinstalled Android tools
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          java -version
          ls "$ANDROID_HOME/build-tools"
      - name: Create the Android project
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm tauri android init --ci
      - name: Keep private keys out of Android cloud backups
        run: |
          set -euo pipefail
          f=apps/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'\sandroid:allowBackup="[^"]*"', '', s)
          s = re.sub(r'\sandroid:fullBackupContent="[^"]*"', '', s)
          s = s.replace('<application', '<application android:allowBackup="false" android:fullBackupContent="false"', 1)
          open(p, 'w').write(s)
          EOF
          grep -n "allowBackup" "$f"
      - name: Build the APK
        working-directory: apps/desktop
        run: pnpm tauri android build --ci --apk --target "$ABI"
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="$(find apps/desktop/src-tauri/gen/android -name '*release-unsigned.apk' | head -1)"
          test -n "$apk"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            pass="$KEYSTORE_PASSWORD"
            alias=vpnflow
          else
            echo "::warning::No signing secret; using a throwaway key. Uninstall the old app before installing the next build."
            pass=throwaway-preview
            alias=preview
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$pass" -keypass "$pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=VPNFlow preview"
          fi
          "$BT/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$pass" --ks-key-alias "$alias" \
            --out "vpnflow-android-$ABI.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "vpnflow-android-$ABI.apk"
          sha256sum "vpnflow-android-$ABI.apk" | tee "vpnflow-android-$ABI.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpnflow-android-${{ inputs.abi }}
          path: |
            vpnflow-android-${{ inputs.abi }}.apk
            vpnflow-android-${{ inputs.abi }}.sha256
          if-no-files-found: error
