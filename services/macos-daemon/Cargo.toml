[package]
name = "vpnflow-daemon"
description = "Root launchd daemon for VPNFlow on macOS: config store, wireguard-go tunnel, routes, DNS and pf kill switch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Runs as root. Keep the dependency list short and audited.
[lib]
name = "vpnflow_daemon"

[[bin]]
name = "vpnflow-daemon"

[dependencies]
aegis-core.workspace = true
aegis-config.workspace = true
aegis-macos.workspace = true
aegis-windows.workspace = true # wire protocol only
ipnet.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "process", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
