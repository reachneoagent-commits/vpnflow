[package]
name = "aegis-windows"
description = "Windows tunnel-service backend for Aegis VPN (client side and service protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The protocol and naming rules are portable so they are unit-tested on any host.
[dependencies]
aegis-core.workspace = true
aegis-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
uuid.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
