[package]
name = "aegis-desktop"
description = "Aegis VPN desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "aegis_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
aegis-core.workspace = true
ipnet.workspace = true
aegis-config.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
# Speed test only: plain blocking HTTPS GET/POST to Cloudflare's speed endpoint.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Plain notify-rust instead of tauri-plugin-notification: it uses zbus 6 on our
# tokio runtime (the plugin still pulls in unmaintained zbus 5 crates).
notify-rust = { version = "4.19", default-features = false, features = ["z-with-tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
aegis-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
aegis-macos.workspace = true

[target.'cfg(windows)'.dependencies]
aegis-windows.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"
